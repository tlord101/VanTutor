name: Generate Fresh Keystore and Secrets

on: workflow_dispatch

jobs:
  create-and-save-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Define Keystore Variables
        # You can change these passwords and alias if you want, or leave them as is
        run: |
          echo "NEW_PASSWORD=AvelutSecureKey2026!" >> $GITHUB_ENV
          echo "NEW_ALIAS=avelut" >> $GITHUB_ENV

      - name: Generate New Keystore
        run: |
          keytool -genkey -v -keystore avelut-release-key.keystore \
            -alias ${{ env.NEW_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Avelut, OU=Dev, O=Avelut, L=City, S=State, C=NG" \
            -storepass ${{ env.NEW_PASSWORD }} \
            -keypass ${{ env.NEW_PASSWORD }}

      - name: Convert to Base64
        run: base64 -w 0 avelut-release-key.keystore > keystore_base64.txt

      - name: Upload Secrets to GitHub using GH_PAT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set ANDROID_KEYSTORE_BASE64 < keystore_base64.txt
          gh secret set KEYSTORE_PASSWORD -b "${{ env.NEW_PASSWORD }}"
          gh secret set KEY_ALIAS -b "${{ env.NEW_ALIAS }}"
          gh secret set KEY_PASSWORD -b "${{ env.NEW_PASSWORD }}"

      - name: Clean up temporary files
        # Deletes the raw files from the runner so they are never exposed
        run: rm avelut-release-key.keystore keystore_base64.txt
