name: Generate Keystore & PEM

on:
  workflow_dispatch:

jobs:
  generate-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract Credentials & Generate Keystore/PEM
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # Extract credentials from build.gradle
          STORE_PASS=$(grep -oP "storePassword\s+['\"]\K[^'\"]+" $BUILD_GRADLE | head -1 || echo "securepassword123")
          KEY_ALIAS=$(grep -oP "keyAlias\s+['\"]\K[^'\"]+" $BUILD_GRADLE | head -1 || echo "avelut_key")
          
          if [ ! -f "app-release-key.keystore" ]; then
            echo "Generating new keystore..."
            keytool -genkey -v -keystore app-release-key.keystore -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $STORE_PASS -keypass $STORE_PASS -dname "CN=Oweilayefa David, OU=Avelut Softwares, O=Avelut Softwares, L=Asubi, ST=Delta, C=NG"
            
            echo "Generating PEM certificate..."
            keytool -exportcert -rfc -alias $KEY_ALIAS -file upload_certificate.pem -keystore app-release-key.keystore -storepass $STORE_PASS
          else
            echo "Keystore already exists. Aborting to protect Play Store signing consistency."
            exit 1
          fi

      - name: Commit Keystore and PEM to Project Root
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate initial release keystore and pem"
          file_pattern: 'app-release-key.keystore upload_certificate.pem'
