name: Generate Fresh Keystore and Secrets

on:
  workflow_dispatch:

jobs:
  create-and-save-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate New Keystore
        # Uses your exact hardcoded alias, filename, and passwords
        run: |
          keytool -genkey -v -keystore avelut-release-key.keystore \
            -alias avelut \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Avelut, OU=Dev, O=Avelut, L=Effurun, S=Delta, C=NG" \
            -storepass "AvelutSecureKey2026!" \
            -keypass "AvelutSecureKey2026!"

      - name: Convert to Base64 String
        run: base64 -w 0 avelut-release-key.keystore > keystore_base64.txt

      - name: Upload Secrets to GitHub Vault
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Automatically assigns the string to your ANDROID_KEYSTORE_BASE64 secret
          gh secret set ANDROID_KEYSTORE_BASE64 < keystore_base64.txt

      - name: Clean Up Runner Environment
        if: always()
        run: rm -f avelut-release-key.keystore keystore_base64.txt
