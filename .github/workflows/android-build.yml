name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build and Sync Capacitor Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' 

      - name: Setup Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' 

      - name: Install Project Dependencies
        run: npm install

      - name: Build Production Web Bundle 
        run: npm run build:mobile

      - name: Sync Web Code to Capacitor Android
        run: npx cap sync android

      - name: Decode and Inject Keystore File
        # Places the binary keystore file directly into android/app/ where Gradle expects it
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/avelut-release-key.keystore

      - name: Build Signed Release APK via Gradle
        # Compiles the app. Gradle reads your hardcoded credentials from build.gradle natively
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avelut-release-apk
          path: android/app/build/outputs/apk/release/*.apk 
