jobs:
  build-android:
    name: Build and Sync Capacitor Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # You can adjust this to match your local environment

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Standard for modern Gradle/Android builds

      - name: Install NPM Dependencies
        run: npm install

      # 1. Matches your: npm run build:mobile
      - name: Build Web Bundle 
        run: npm run build:mobile

      # 2. Matches your: npx cap sync android
      - name: Sync with Capacitor
        run: npx cap sync android

      # 3. Matches your: .\gradlew.bat assembleRelease
      # Note: We use ./gradlew for the Linux runner and grant execution permissions first
      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
        env:
          # Required if passing signing configs via environment variables
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 4. Matches your final success message by uploading the APK for download
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk # See note below about signing
